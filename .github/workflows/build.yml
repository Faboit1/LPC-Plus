name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # paper-api 26.1.2 ships Java 25 class files, so the compiler must run on
      # JDK 25. The pom still targets Java 8 bytecode, which keeps the jar
      # loadable on the older servers plugin.yml declares support for.
      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: LPC-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
