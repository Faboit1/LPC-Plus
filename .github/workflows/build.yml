name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # paper-api 26.1.2 ships Java 25 class files, so the compiler must run on
      # JDK 25. The pom still targets Java 8 bytecode, which keeps the jar
      # loadable on the older servers plugin.yml declares support for.
      - name: Build with Maven
        run: mvn -B -ntp clean package

      # plugin.yml and config.yml are resources, so compiling never looks at them: a
      # broken descriptor builds green and only fails when a server tries to load it.
      - name: Validate plugin.yml and config.yml
        run: |
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java -cp "target/classes:$(cat target/cp.txt)" .github/scripts/DescriptorCheck.java

      - name: Upload plugin jar
        uses: actions/upload-artifact@v5
        with:
          name: LPC-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30
